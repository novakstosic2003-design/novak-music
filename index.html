const list = document.getElementById("list");
const search = document.getElementById("search");
const status = document.getElementById("status");

function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function render(){
  const q=search.value.trim().toLowerCase();
  const a=q ? songs.filter(s=>(s.title+" "+s.artist).toLowerCase().includes(q)) : songs;
  status.textContent=a.length+" / "+songs.length+" pesama";
  if(!a.length){list.innerHTML='<div class="empty">Nema rezultata.</div>';return;}
  list.innerHTML=a.map(function(s){
    return '<div class="song"><div class="num">'+s.number+'</div><div class="info"><div class="title">'+esc(s.title)+'</div><div class="artist">'+esc(s.artist)+'</div></div><a class="play" href="https://www.youtube.com/watch?v='+encodeURIComponent(s.videoId)+'">▶ PLAY</a></div>';
  }).join("");
}
search.addEventListener("input",render);
render();
</script>
